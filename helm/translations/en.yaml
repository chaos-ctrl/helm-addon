# The labels and help texts Home Assistant shows on the add-on's Configuration tab.
configuration:
  timezone:
    name: Time zone
    description: "Your time zone, for example Europe/Paris. Reminders and check-ins use it."
  tailscale_hostname:
    name: Tailscale name
    description: "Helm's name on your Tailscale network. Leave it as helm: the address becomes https://helm.<your-tailnet>.ts.net"
  tailscale_auth_key:
    name: Tailscale auth key
    description: "Needed once, for the first start (Tailscale admin console > Settings > Keys > Generate auth key). You can empty it afterwards."
  allow_home_network:
    name: Allow the home network (emergency only)
    description: "Off = Helm opens only through Tailscale. Turn on only if Tailscale is broken, and turn it off again afterwards."
  alerts_to_this_address:
    name: Send security alerts to
    description: "The address that receives alerts (new device, wrong passwords...). Usually your personal Gmail."
  alerts_from_this_gmail:
    name: Send alerts from (Gmail address)
    description: "A separate Gmail account used only for sending, so your personal account's details are never stored in Helm."
  alerts_from_gmail_app_password:
    name: App password of that sending account
    description: "16 letters from myaccount.google.com/apppasswords, made while signed in to the SENDING account (not your normal password)."
  openrouter_api_key:
    name: OpenRouter key (MiMo, everyday AI)
    description: "From openrouter.ai/keys. Used for most AI help. Optional."
  anthropic_api_key:
    name: Anthropic key (Claude Sonnet, work tasks)
    description: "From console.anthropic.com/settings/keys. Used for cards in the Work space. Optional."
  own_ai_address:
    name: Your own AI service, address (optional)
    description: "Any service that speaks the OpenAI format: OpenAI (https://api.openai.com/v1), Gemini (https://generativelanguage.googleapis.com/v1beta/openai), or one at home such as Ollama (http://homeassistant.local:11434/v1). Then add its models in Helm > Settings > AI."
  own_ai_key:
    name: Your own AI service, key (optional)
    description: "The key of that service. Leave empty for one at home that needs none."
  own_ai_name:
    name: Your own AI service, name (optional)
    description: "A short name shown in error messages, e.g. Ollama."
  github_read_token:
    name: GitHub read-only key (job agent)
    description: "A fine-grained GitHub token with Contents: read-only on the job agent's repository only. Steps in the Documentation tab, section Job agent."
  job_agent_repo:
    name: Job agent repository
    description: "owner/name of the job agent's GitHub repository."
  job_agent_write_token:
    name: GitHub write key (job agent only)
    description: "Optional. A second fine-grained token, Contents: read and write, on the job agent's repository only. Lets Done / Let it go on job cards go back to the agent. Steps in the Documentation tab."
  calendar_urls:
    name: Calendars (private iCal addresses)
    description: "Optional. Google Calendar > Settings > your calendar > Integrate calendar > 'Secret address in iCal format'. Several: separated by spaces. Read-only. Steps in the Documentation tab, section Calendar."
  google_client_id:
    name: Google client ID (Google Tasks)
    description: "Optional. From your own Google Cloud project (APIs & Services > Credentials > OAuth client ID, type Web application). Ends with .apps.googleusercontent.com. Steps in the Documentation tab, section Google Tasks."
  google_client_secret:
    name: Google client secret
    description: "Optional. Shown next to the client ID. Helm asks Google for read-only access to your tasks, and only after you press Connect in Settings > Google."
  heartbeat_url:
    name: Still-alive signal (healthchecks.io)
    description: "Optional. The ping address of a healthchecks.io check. Helm opens it every 5 minutes; when it stops, healthchecks.io alerts you. Steps in the Documentation tab."
  job_alerts_mailbox_address:
    name: Job-alert mailbox (address)
    description: "Optional. A SEPARATE mailbox (not your main one) that receives your forwarded job-alert emails (LinkedIn, Welcome to the Jungle, APEC...). Helm reads it read-only and never changes or sends anything."
  job_alerts_mailbox_app_password:
    name: Job-alert mailbox (app password)
    description: "The app password of that mailbox (Gmail: an app password; your normal password does not work)."
  job_alerts_mailbox_imap_host:
    name: Job-alert mailbox (IMAP server)
    description: "Default imap.gmail.com."
  my_people_repo:
    name: My People data repository
    description: "Optional. Leave empty: People are kept inside Helm. Only fill in to read and write a GitHub repository of people files instead (owner/name)."
  my_people_sync:
    name: Sync People with a GitHub repository
    description: "Off (the default): People are kept inside Helm. Switch on only to read and write the repository named above instead."
  my_people_write_token:
    name: GitHub write key (My People only)
    description: "Optional. A fine-grained token, Contents: read and write, on My People's data repository only. Lets Helm save what you tell it about people (you confirm every change). Steps in the Documentation tab, section My People."
  ai_report_repo:
    name: AI-model report repository
    description: "owner/name of the repository that writes the weekly AI-model report (data/panel.json). Read with the read-only key. Empty = no report card."
